<svg xmlns="http://www.w3.org/2000/svg" width="680" height="514" viewBox="0 0 680 514" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Chapter 3 pipeline flow</title>
<desc id="figdesc">A shared foundation of hybrid model, virtual constraints and I/O linearization feeds two separate flows: an offline optimization that solves for alpha and runs once, and an online control loop that picks mu every timestep. Both meet at a verification stage that produces the reference gait.</desc>
<style>
  .bg   { fill: #ffffff; }
  .t    { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; }
  .th   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; }
  .ts   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
  .bx   { stroke-width: 0.5; }
  .gy   { fill: #F1EFE8; stroke: #5F5E5A; }
  .pu   { fill: #EEEDFE; stroke: #534AB7; }
  .te   { fill: #E1F5EE; stroke: #0F6E56; }
  .gy-t { fill: #2C2C2A; }  .gy-s { fill: #5F5E5A; }
  .pu-t { fill: #26215C; }  .pu-s { fill: #534AB7; }
  .te-t { fill: #04342C; }  .te-s { fill: #0F6E56; }
  .arr  { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .reg  { fill: none; stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 4 3; }
  .reg-t{ fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #1c1c1a; }
    .gy   { fill: #444441; stroke: #B4B2A9; }
    .pu   { fill: #3C3489; stroke: #AFA9EC; }
    .te   { fill: #085041; stroke: #5DCAA5; }
    .gy-t { fill: #D3D1C7; }  .gy-s { fill: #B4B2A9; }
    .pu-t { fill: #CECBF6; }  .pu-s { fill: #AFA9EC; }
    .te-t { fill: #9FE1CB; }  .te-s { fill: #5DCAA5; }
    .arr  { stroke: #B4B2A9; }
    .reg  { stroke: #5F5E5A; }
    .reg-t{ fill: #B4B2A9; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="bg" x="0" y="0" width="680" height="514"/>

<rect class="bx gy" x="70" y="50" width="150" height="52" rx="4"/>
<text class="th gy-t" x="145" y="72" text-anchor="middle">Hybrid model</text>
<text class="ts gy-s" x="145" y="90" text-anchor="middle">f, g, &#916;, guard</text>

<rect class="bx gy" x="240" y="50" width="180" height="52" rx="4"/>
<text class="th gy-t" x="330" y="72" text-anchor="middle">Virtual constraints</text>
<text class="ts gy-s" x="330" y="90" text-anchor="middle">y, ydot, phase s</text>

<rect class="bx gy" x="440" y="50" width="170" height="52" rx="4"/>
<text class="th gy-t" x="525" y="72" text-anchor="middle">I/O linearization</text>
<text class="ts gy-s" x="525" y="90" text-anchor="middle">Lf2y, LgLfy, u_ff</text>

<line class="arr" x1="220" y1="76" x2="240" y2="76" marker-end="url(#arrow)"/>
<line class="arr" x1="420" y1="76" x2="440" y2="76" marker-end="url(#arrow)"/>

<rect class="reg" x="75" y="125" width="240" height="205" rx="4"/>
<rect class="reg" x="365" y="125" width="240" height="205" rx="4"/>
<text class="ts reg-t" x="87" y="147">offline &#8212; runs once</text>
<text class="ts reg-t" x="377" y="147">online &#8212; every timestep</text>

<path class="arr" d="M525 102 L525 118 L195 118 L195 160" marker-end="url(#arrow)"/>
<path class="arr" d="M525 118 L485 118 L485 160" marker-end="url(#arrow)"/>

<rect class="bx pu" x="90" y="160" width="210" height="52" rx="4"/>
<text class="th pu-t" x="195" y="182" text-anchor="middle">Offline optimization</text>
<text class="ts pu-s" x="195" y="200" text-anchor="middle">fmincon solves for alpha</text>

<rect class="bx te" x="380" y="160" width="210" height="52" rx="4"/>
<text class="th te-t" x="485" y="182" text-anchor="middle">Online control</text>
<text class="ts te-s" x="485" y="200" text-anchor="middle">each law picks mu</text>

<line class="arr" x1="195" y1="212" x2="195" y2="242" marker-end="url(#arrow)"/>
<line class="arr" x1="485" y1="212" x2="485" y2="242" marker-end="url(#arrow)"/>

<rect class="bx pu" x="90" y="242" width="210" height="52" rx="4"/>
<text class="th pu-t" x="195" y="264" text-anchor="middle">Mesh verification</text>
<text class="ts pu-s" x="195" y="282" text-anchor="middle">fails &#8594; remesh, re-solve</text>

<rect class="bx te" x="380" y="242" width="210" height="52" rx="4"/>
<text class="th te-t" x="485" y="264" text-anchor="middle">Simulate the step</text>
<text class="ts te-s" x="485" y="282" text-anchor="middle">ode45 up to the guard</text>

<path class="arr" d="M195 294 L195 340 L340 340 L340 360" marker-end="url(#arrow)"/>
<path class="arr" d="M485 294 L485 340 L340 340 L340 360" marker-end="url(#arrow)"/>

<rect class="bx gy" x="220" y="360" width="240" height="52" rx="4"/>
<text class="th gy-t" x="340" y="382" text-anchor="middle">Report and Poincar&#233;</text>
<text class="ts gy-s" x="340" y="400" text-anchor="middle">rho &lt; 1 attracts, &#8805; 1 repels</text>

<line class="arr" x1="340" y1="412" x2="340" y2="442" marker-end="url(#arrow)"/>

<rect class="bx gy" x="240" y="442" width="200" height="52" rx="4"/>
<text class="th gy-t" x="340" y="464" text-anchor="middle">Reference gait</text>
<text class="ts gy-s" x="340" y="482" text-anchor="middle">alpha, verified, stable</text>
</svg>
