<svg xmlns="http://www.w3.org/2000/svg" width="820" height="980" viewBox="0 0 820 980" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Inside one ch3_col_eval pass</title>
<desc id="figdesc">A candidate z is unpacked into X, T and alpha. Every node is run through ch3_col_dynamics then ch3_io_lin to get feedforward torque, the drift, contact force and swing-foot height. Midpoints are found by Hermite interpolation and re-evaluated through the same dynamics. Hermite-Simpson defects and a Simpson quadrature of torque-squared are formed, and ch3_impact is applied at the final node. The result feeds both the cost and the constraints, which feed one fmincon SQP step; the step proposes a new z and the loop repeats, checkpointing z every few iterations.</desc>
<style>
  .bg     { fill: #ffffff; }
  .proc   { fill: #eef0fb; stroke: #3d4f9e; stroke-width: 1.5; }
  .data   { fill: #ffffff; stroke: #3d4f9e; stroke-width: 1.5; }
  .container { fill: #fbfbf9; stroke: #b9beb0; stroke-width: 1.25; stroke-dasharray: 5 4; }
  .fn     { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1b2130; text-anchor: middle; }
  .fn-sm  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 700; fill: #1b2130; text-anchor: middle; }
  .step   { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1b2130; text-anchor: middle; }
  .desc   { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 10px; fill: #5a6270; text-anchor: middle; }
  .glabel { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 11.5px; font-style: italic; fill: #8891a0; }
  .edge   { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 10.5px; }
  .edge.ok   { fill: #3d4f9e; }
  .edge.warn { fill: #a86a0c; }
  .line.main { stroke: #3d4f9e; stroke-width: 1.5; fill: none; }
  .line.warn { stroke: #a86a0c; stroke-width: 1.5; fill: none; }
</style>

<defs>
  <marker id="arrow-main2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#3d4f9e"/>
  </marker>
  <marker id="arrow-warn2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#a86a0c"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="820" height="980"/>

<!-- Z -->
<rect class="data" x="270" y="30" width="220" height="50" rx="6"/>
<text class="fn" x="380" y="60">z = [X ; T ; alpha]</text>

<path class="line main" d="M380,80 L380,110" marker-end="url(#arrow-main2)"/>

<!-- container -->
<rect class="container" x="140" y="110" width="480" height="580" rx="10"/>
<text class="glabel" x="160" y="132">ch3_col_eval — one cached pass per z</text>

<!-- UNP -->
<rect class="proc" x="190" y="150" width="380" height="70" rx="8"/>
<text class="fn" x="380" y="177">ch3_col_unpack</text>
<text class="desc" x="380" y="195">X is 14 x N, T scalar, alpha is 4 x 6</text>
<path class="line main" d="M380,220 L380,240" marker-end="url(#arrow-main2)"/>

<!-- ND -->
<rect class="proc" x="190" y="240" width="380" height="70" rx="8"/>
<text class="fn-sm" x="380" y="267">ch3_col_dynamics -&gt; ch3_io_lin</text>
<text class="desc" x="380" y="285">one KKT factorization per node</text>
<path class="line main" d="M380,310 L380,330" marker-end="url(#arrow-main2)"/>

<!-- NDO -->
<rect class="data" x="190" y="330" width="380" height="70" rx="8"/>
<text class="fn" x="380" y="359">u_ff, f_k, lambda_k,</text>
<text class="fn" x="380" y="375">swing-foot height</text>
<path class="line main" d="M380,400 L380,420" marker-end="url(#arrow-main2)"/>

<!-- MID -->
<rect class="proc" x="190" y="420" width="380" height="70" rx="8"/>
<text class="step" x="380" y="447">midpoints by Hermite interpolation</text>
<text class="desc" x="380" y="465">re-evaluated through the same dynamics</text>
<path class="line main" d="M380,490 L380,510" marker-end="url(#arrow-main2)"/>

<!-- DEF -->
<rect class="proc" x="190" y="510" width="380" height="70" rx="8"/>
<text class="step" x="380" y="537">Hermite-Simpson defects</text>
<text class="desc" x="380" y="555">+ Simpson quadrature of u squared</text>
<path class="line main" d="M380,580 L380,600" marker-end="url(#arrow-main2)"/>

<!-- IMP -->
<rect class="proc" x="190" y="600" width="380" height="70" rx="8"/>
<text class="fn" x="380" y="620">ch3_impact</text>
<text class="desc" x="380" y="636">at node N</text>
<text class="desc" x="380" y="650">x_next, impact impulse</text>

<!-- IMP -> COST / CON -->
<path class="line main" d="M380,670 L380,710 L250,710 L250,740" marker-end="url(#arrow-main2)"/>
<path class="line main" d="M380,670 L380,710 L510,710 L510,740" marker-end="url(#arrow-main2)"/>

<!-- COST -->
<rect class="proc" x="140" y="740" width="220" height="70" rx="8"/>
<text class="fn" x="250" y="767">ch3_col_cost</text>
<text class="desc" x="250" y="785">J = &#8747;u&#178; / L_step</text>

<!-- CON -->
<rect class="proc" x="400" y="740" width="220" height="70" rx="8"/>
<text class="fn" x="510" y="767">ch3_col_constraints</text>
<text class="desc" x="510" y="785">ceq and c</text>

<!-- COST/CON -> F -->
<path class="line main" d="M250,810 L250,830 L380,830 L380,850" marker-end="url(#arrow-main2)"/>
<path class="line main" d="M510,810 L510,830 L380,830 L380,850" marker-end="url(#arrow-main2)"/>

<!-- F -->
<rect class="proc" x="240" y="850" width="280" height="70" rx="8"/>
<text class="fn" x="380" y="877">fmincon</text>
<text class="desc" x="380" y="895">central finite differences, ScaleProblem off</text>

<!-- F -> Z (new z) -->
<path class="line warn" d="M240,885 L80,885 L80,55 L270,55" marker-end="url(#arrow-warn2)"/>
<rect x="115" y="870" width="60" height="16" fill="#ffffff" opacity="0.85"/>
<text class="edge warn" x="120" y="882">new z</text>

<!-- F -> CK (checkpoint) -->
<path class="line main" d="M520,885 L560,885" marker-end="url(#arrow-main2)"/>

<!-- CK cylinder -->
<path class="proc" d="M560,850 L560,908 A110,12 0 0,0 780,908 L780,850" stroke="#3d4f9e" stroke-width="1.5" fill="#eef0fb"/>
<ellipse class="proc" cx="670" cy="850" rx="110" ry="12"/>
<text class="fn" x="670" y="876">p.checkpoint_file</text>
<text class="desc" x="670" y="893">every checkpoint_every iterations</text>

</svg>
