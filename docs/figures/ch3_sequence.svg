<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 0 800 660" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Chapter 3 sequence: design once, run forever</title>
<desc id="figdesc">Engineer, Optimizer and Verifier exchange messages once offline to produce alpha, a verified periodic gait. The Engineer deploys alpha to the Controller, which then exchanges state and torque with the Robot every timestep in a loop, until a foot impact ends the step and the loop repeats.</desc>
<style>
  .bg   { fill: #ffffff; }
  .t    { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; }
  .th   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; }
  .bx   { stroke-width: 0.5; }
  .pu   { fill: #EEEDFE; stroke: #534AB7; }
  .te   { fill: #E1F5EE; stroke: #0F6E56; }
  .pu-t { fill: #26215C; }
  .te-t { fill: #04342C; }
  .life { stroke: #B4B2A9; stroke-width: 1; }
  .arr  { stroke: #5F5E5A; stroke-width: 1.4; fill: none; }
  .arr-d{ stroke: #5F5E5A; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
  .lbl  { fill: #2C2C2A; }
  .reg  { fill: none; stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 4 3; }
  .reg-t{ fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #1c1c1a; }
    .pu   { fill: #3C3489; stroke: #AFA9EC; }
    .te   { fill: #085041; stroke: #5DCAA5; }
    .pu-t { fill: #CECBF6; }
    .te-t { fill: #9FE1CB; }
    .life { stroke: #5F5E5A; }
    .arr  { stroke: #B4B2A9; }
    .arr-d{ stroke: #B4B2A9; }
    .lbl  { fill: #D3D1C7; }
    .reg  { stroke: #5F5E5A; }
    .reg-t{ fill: #B4B2A9; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="800" height="660"/>

<!-- lifelines -->
<line class="life" x1="80"  y1="66" x2="80"  y2="600"/>
<line class="life" x1="240" y1="66" x2="240" y2="600"/>
<line class="life" x1="400" y1="66" x2="400" y2="600"/>
<line class="life" x1="560" y1="66" x2="560" y2="600"/>
<line class="life" x1="720" y1="66" x2="720" y2="600"/>

<!-- top participant boxes -->
<rect class="bx pu" x="10"  y="20" width="140" height="46" rx="5"/>
<text class="th pu-t" x="80" y="48" text-anchor="middle">Engineer</text>
<rect class="bx pu" x="170" y="20" width="140" height="46" rx="5"/>
<text class="th pu-t" x="240" y="48" text-anchor="middle">Optimizer</text>
<rect class="bx pu" x="330" y="20" width="140" height="46" rx="5"/>
<text class="th pu-t" x="400" y="48" text-anchor="middle">Verifier</text>
<rect class="bx te" x="490" y="20" width="140" height="46" rx="5"/>
<text class="th te-t" x="560" y="48" text-anchor="middle">Controller</text>
<rect class="bx te" x="650" y="20" width="140" height="46" rx="5"/>
<text class="th te-t" x="720" y="48" text-anchor="middle">Robot</text>

<!-- bottom participant boxes -->
<rect class="bx pu" x="10"  y="600" width="140" height="46" rx="5"/>
<text class="th pu-t" x="80" y="628" text-anchor="middle">Engineer</text>
<rect class="bx pu" x="170" y="600" width="140" height="46" rx="5"/>
<text class="th pu-t" x="240" y="628" text-anchor="middle">Optimizer</text>
<rect class="bx pu" x="330" y="600" width="140" height="46" rx="5"/>
<text class="th pu-t" x="400" y="628" text-anchor="middle">Verifier</text>
<rect class="bx te" x="490" y="600" width="140" height="46" rx="5"/>
<text class="th te-t" x="560" y="628" text-anchor="middle">Controller</text>
<rect class="bx te" x="650" y="600" width="140" height="46" rx="5"/>
<text class="th te-t" x="720" y="628" text-anchor="middle">Robot</text>

<!-- 1. Engineer -> Optimizer -->
<text class="t lbl" x="160" y="94" text-anchor="middle">provide seed pose</text>
<line class="arr" x1="80" y1="102" x2="240" y2="102" marker-end="url(#arrow)"/>

<!-- 2. Optimizer self-loop -->
<text class="t lbl" x="240" y="140" text-anchor="middle">search alpha coefficients</text>
<path class="arr" d="M240 150 C 290 150, 290 182, 240 182" marker-end="url(#arrow)"/>

<!-- 3. Optimizer -> Verifier -->
<text class="t lbl" x="320" y="219" text-anchor="middle">evaluate trajectory</text>
<line class="arr" x1="240" y1="227" x2="400" y2="227" marker-end="url(#arrow)"/>

<!-- 4. Verifier --> Optimizer (dashed, reject) -->
<text class="t lbl" x="320" y="255" text-anchor="middle">refine mesh, retry</text>
<line class="arr-d" x1="400" y1="263" x2="240" y2="263" marker-end="url(#arrow)"/>

<!-- 5. Verifier --> Engineer (dashed, confirm) -->
<text class="t lbl" x="240" y="295" text-anchor="middle">confirm stable gait</text>
<line class="arr-d" x1="400" y1="303" x2="80" y2="303" marker-end="url(#arrow)"/>

<!-- 6. Engineer -> Controller (deploy) -->
<text class="t lbl" x="320" y="335" text-anchor="middle">deploy alpha</text>
<line class="arr" x1="80" y1="343" x2="560" y2="343" marker-end="url(#arrow)"/>

<!-- loop region: Controller <-> Robot, every timestep -->
<rect class="reg" x="505" y="365" width="270" height="130" rx="5"/>
<text class="t reg-t" x="517" y="384">loop &#8212; every timestep</text>

<text class="t lbl" x="640" y="415" text-anchor="middle">send current state</text>
<line class="arr" x1="720" y1="423" x2="560" y2="423" marker-end="url(#arrow)"/>

<text class="t lbl" x="640" y="455" text-anchor="middle">apply control torque</text>
<line class="arr" x1="560" y1="463" x2="720" y2="463" marker-end="url(#arrow)"/>

<!-- Robot self-loop: foot impact -->
<text class="t lbl" x="720" y="527" text-anchor="end">foot impact, repeat</text>
<path class="arr" d="M720 537 C 670 537, 670 569, 720 569" marker-end="url(#arrow)"/>

</svg>
